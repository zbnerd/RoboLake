[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "robolake"
version = "0.1.0"
description = "Robot dataset transfer and registry platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.39,<2",
    "fastapi[standard]>=0.116,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0.41,<3",
    "typer>=0.16,<1",
]

[project.scripts]
robolake = "apps.cli.main:app"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.39,<2",
    "mypy>=1.16,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.fastapi]
entrypoint = "apps.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "robolake*"]
exclude = ["tests*"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=apps",
    "--cov=robolake",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "unit: isolated tests without external services",
    "integration: tests requiring PostgreSQL and MinIO",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["apps", "robolake", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true
